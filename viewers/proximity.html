<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../theme.css?v=6">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proximity — This Library Inside a Word-Vector Model · Recursive Repatterning</title>
<link rel="icon" type="image/svg+xml" href="../public/favicon.svg?v=2">
<!--
  proximity.html — a slice of an existing open word-vector model, with this
  library's vocabulary lit up inside it.

  Reads schools/_proximity.json, generated by scripts/build_proximity.py. Nothing
  is computed here: positions, neighbours and suggestions are all precomputed at
  build time, so a visitor downloads one JSON and no model.

  The positions are a 2-D PCA projection and therefore lossy — the file records
  how much variance those two dimensions actually carry, and this page prints it
  rather than hiding it. Neighbour lists come from the FULL space, not from the
  projection, so two dots sitting close on screen are not necessarily neighbours.
  That gap between what you see and what is true is stated on the page, because
  it is the honest caveat of every scatter like this.
-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);color-scheme:light;
    font-family:var(--sans,Inter,system-ui,sans-serif)}
  .wrap{display:flex;height:calc(100vh - 52px);min-height:0}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;
    border-bottom:1px solid var(--line)}
  .toolbar .title{font-weight:700;font-size:14px;margin-right:auto}
  .toolbar .title .sub{color:var(--mut);font-weight:400;font-size:12px}
  .toolbar input[type=search]{font:inherit;font-size:12px;padding:6px 10px;border-radius:8px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:190px}
  .toolbar button{background:var(--surface);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer}
  .toolbar button:hover{border-color:var(--gold);color:var(--gold)}
  .toolbar button.on{border-color:var(--gold);color:var(--gold);font-weight:600}
  #plot{flex:1;position:relative;overflow:hidden}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg:active{cursor:grabbing}
  circle.pt{cursor:pointer;stroke:var(--bg);stroke-width:.8px}
  circle.pt:hover{stroke:var(--ink);stroke-width:1.6px}
  text.lbl{font-size:10px;fill:var(--ink-soft);pointer-events:none;paint-order:stroke;
    stroke:var(--bg);stroke-width:2.5px;stroke-linejoin:round}
  .dim{opacity:.12}
  .caption{padding:8px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);
    line-height:1.5}
  .caption b{color:var(--ink-soft);font-weight:600}
  aside{width:330px;max-width:86vw;background:var(--surface);border-left:1px solid var(--line);
    padding:16px;overflow:auto}
  aside h2{margin:.1em 0 .2em;font-size:17px;font-family:var(--serif-display,serif)}
  aside .meta{font-size:11.5px;color:var(--mut);margin-bottom:12px}
  aside h3{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);
    margin:16px 0 6px}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    background:var(--chip,#f1ece1);color:var(--ink-soft);margin:0 4px 4px 0;text-decoration:none}
  a.chip:hover{background:var(--gold);color:#fff}
  .nbr{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;
    border-bottom:1px dotted var(--line)}
  .nbr a{color:var(--ink);text-decoration:none;cursor:pointer}
  .nbr a:hover{color:var(--gold)}
  .nbr .s{color:var(--mut);font-variant-numeric:tabular-nums}
  .note{font-size:12px;line-height:1.55;color:var(--ink-soft);margin:8px 0 0}
  .empty{color:var(--mut);font-size:12.5px;line-height:1.6}
  @media(max-width:820px){ .wrap{flex-direction:column;height:auto}
    #plot{height:58vh} aside{width:100%;max-width:none;border-left:none;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<script src="../site-header.js?v=51"></script>
<site-header active="proximity"></site-header>

<div class="wrap">
  <div id="stage">
    <div class="toolbar">
      <div class="title">Proximity <span class="sub">— this library's words, placed by somebody else's model</span></div>
      <input type="search" id="q" placeholder="find a word…">
      <button id="btn-absent">Words it has never seen</button>
      <button id="btn-gaps">Words we are missing</button>
    </div>
    <div id="plot"><svg id="svg"></svg></div>
    <div class="caption" id="caption">Loading…</div>
  </div>
  <aside id="panel"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null, byTerm={}, sel=null;

const PALETTE=['#0f766e','#c9a24b','#e07a5f','#81b29a','#6d8ec9','#9b6dc9','#c96d9b','#9a7322','#4db6ac','#e57373','#6b6457','#b5512f'];
let colourOf={};

fetch('../schools/_proximity.json')
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{ DATA=d; d.terms.forEach(t=>byTerm[t.term]=t); init(); })
  .catch(e=>{
    $('caption').innerHTML='Could not load <code>schools/_proximity.json</code>. '+
      'Generate it with <code>python scripts/build_proximity.py</code>.';
  });

function init(){
  const schools=[...new Set(DATA.terms.flatMap(t=>t.schools))].sort();
  schools.forEach((s,i)=>colourOf[s]=PALETTE[i%PALETTE.length]);

  $('caption').innerHTML =
    `<b>${DATA.counts.in_model}</b> of this library's words exist in <b>${esc(DATA.model)}</b> `+
    `(${DATA.dims} dimensions, ${'400,000'} words). Dots are a 2-D PCA projection carrying `+
    `<b>${(DATA.pca_explained_variance*100).toFixed(0)}%</b> of the original variance — so most of the `+
    `structure is flattened away, and two dots close together are <em>not</em> necessarily neighbours. `+
    `The neighbour lists in the panel are computed in the full ${DATA.dims}-dimensional space and are the `+
    `trustworthy part. This is one corpus's associations, not the shape of feeling.`;

  draw();
  $('q').addEventListener('input', onSearch);
  $('btn-absent').addEventListener('click', ()=>showAbsent());
  $('btn-gaps').addEventListener('click', ()=>showGaps());
  showIntro();
}

let g, svg, zoom;
function draw(){
  const el=$('plot'), W=el.clientWidth, H=el.clientHeight;
  svg=d3.select('#svg').attr('viewBox',[0,0,W,H]);
  svg.selectAll('*').remove();
  g=svg.append('g');
  zoom=d3.zoom().scaleExtent([0.6,14]).on('zoom',ev=>{
    g.attr('transform',ev.transform);
    g.selectAll('text.lbl').style('display', ev.transform.k>2.2?null:'none');
    g.selectAll('circle.pt').attr('r', 3.4/Math.sqrt(ev.transform.k));
  });
  svg.call(zoom);

  const pad=26;
  const x=d3.scaleLinear([0,1],[pad,W-pad]);
  const y=d3.scaleLinear([0,1],[H-pad,pad]);

  const node=g.selectAll('g.n').data(DATA.terms).join('g').attr('class','n')
    .attr('transform',d=>`translate(${x(d.xy[0])},${y(d.xy[1])})`);
  node.append('circle').attr('class','pt').attr('r',3.4)
    .attr('fill',d=>colourOf[d.schools[0]]||'#888')
    .on('click',(e,d)=>select(d.term));
  node.append('text').attr('class','lbl').attr('x',5).attr('y',3.5)
    .style('display','none').text(d=>d.term);
}
window.addEventListener('resize',()=>{ if(DATA) draw(); });

function select(term){
  sel=term; const t=byTerm[term];
  if(!t){ return; }
  g.selectAll('g.n').classed('dim',d=>{
    if(d.term===term) return false;
    return !t.near.some(n=>n.term===d.term);
  });
  const schoolChips=t.schools.map(s=>
    `<span class="chip" style="background:${colourOf[s]}22;color:${colourOf[s]}">${esc(s)}</span>`).join('');
  const itemLinks=t.items.map(i=>{
    const [slug,id]=i.split('/');
    return `<a class="chip" href="cards.html?src=../schools/${encodeURIComponent(slug)}/grammar.json">${esc(slug)}</a>`;
  }).join('');
  $('panel').innerHTML=`
    <h2>${esc(t.term)}</h2>
    <div class="meta">used by ${t.schools.length} school${t.schools.length===1?'':'s'} ·
      via ${t.sources.map(esc).join(', ')}</div>
    ${schoolChips}
    <h3>Nearest in the model</h3>
    ${t.near.map(n=>`<div class="nbr"><a onclick="select('${esc(n.term)}')">${esc(n.term)}</a>
      <span class="s">${n.score.toFixed(2)}</span></div>`).join('')}
    <h3>Open a school</h3>
    ${itemLinks||'<span class="empty">—</span>'}
    <p class="note">Neighbours are cosine-nearest in the full ${DATA.dims}-dimensional space,
    not in the flattened picture. A word can be near this one and sit far away on screen.</p>`;
}

function showIntro(){
  $('panel').innerHTML=`
    <h2>A borrowed map</h2>
    <p class="note">Every dot is a word this library uses, placed where
    <b>${esc(DATA.model)}</b> puts it — a model trained on Wikipedia and Gigaword, published
    openly, and built by people with no interest in emotion theory.</p>
    <p class="note">That is the point. This is not a map we drew to agree with us; it is an
    artifact we are exhibiting, the same way the library exhibits Plutchik's wheel. It shows
    how these words <em>co-occur in one large English-dominant corpus</em> — which is a real
    fact about that corpus, and not a fact about feeling.</p>
    <p class="note">Click any dot. Or start with the two buttons above: the words this model
    has never encountered, and the words it thinks belong here that the library does not hold.</p>`;
  if(g) g.selectAll('g.n').classed('dim',false);
}

function showAbsent(){
  const single=DATA.missing.filter(m=>m.kind==='single-word');
  const compound=DATA.missing.filter(m=>m.kind==='compound');
  $('panel').innerHTML=`
    <h2>Words it has never seen</h2>
    <div class="meta">${single.length} single words absent from a 400,000-word English model</div>
    <p class="note">These have no vector at all. Not because they are rare words for common
    things, but because an English-dominant corpus never had much occasion to use them:
    <em>śṛṅgāra</em>, <em>nigredo</em>, <em>allegrezza</em>, <em>omote</em>. A word missing
    from the model is often a word that does not translate into the model's language —
    which is the argument this library keeps making, arriving here as a gap in a data file.</p>
    ${single.map(m=>`<span class="chip" title="${esc(m.schools.join(', '))}">${esc(m.term)}</span>`).join('')}
    <h3>Not the same thing (${compound.length})</h3>
    <p class="note">These are absent for a dull reason: they are phrases our own build script
    joined with a hyphen — <em>repair-attempt</em>, <em>strange-situation</em> — and no
    word-level model has such tokens. Listed separately so they do not inflate the finding above.</p>
    ${compound.map(m=>`<span class="chip">${esc(m.term)}</span>`).join('')}`;
  if(g) g.selectAll('g.n').classed('dim',false);
}

function showGaps(){
  $('panel').innerHTML=`
    <h2>Words we are missing</h2>
    <div class="meta">near several of our terms, held by no school here</div>
    <p class="note">Each of these sits close to two or more words the library already uses,
    yet has no item of its own. Read as a to-do list written by a corpus rather than by us —
    useful precisely because it has no opinion about what a school of emotion ought to contain.</p>
    ${DATA.outside.map(o=>`<div class="nbr">
      <a onclick="select('${esc(o.near_our[0])}')">${esc(o.term)}</a>
      <span class="s">${o.shared_neighbours}×</span></div>`).join('')}
    <p class="note">The number counts how many of our words it neighbours. Click to jump to
    one of them.</p>`;
  if(g) g.selectAll('g.n').classed('dim',false);
}

function onSearch(e){
  const q=e.target.value.trim().toLowerCase();
  if(!q){ if(g) g.selectAll('g.n').classed('dim',false); return; }
  if(g) g.selectAll('g.n').classed('dim',d=>!d.term.includes(q));
  const hit=DATA.terms.find(t=>t.term===q)||DATA.terms.find(t=>t.term.startsWith(q));
  if(hit) select(hit.term);
}
</script>
<script src="../site-footer.js?v=2"></script>
<script src="../assistant.js" defer></script>
</body>
</html>
