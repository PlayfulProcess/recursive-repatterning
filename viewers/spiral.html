<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../theme.css?v=6">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Spiral — Your Own Casts Over Time · Recursive Repatterning</title>
<link rel="icon" type="image/svg+xml" href="../public/favicon.svg?v=2">
<!--
  spiral.html — the dynamic half of the pair that proximity.html opens.

  Proximity shows the corpus's priors: static geometry, the same for every
  visitor. The Spiral shows one person's own process: their casts of the house
  spread, in the order they were made, with the recursion drawn rather than
  explained — a dashed arc from each turn's Possibilities dot to the next
  turn's Structures dot. That arc IS the deck's thesis (see the-new-game and
  The Spread's own "how to use" in schools/overflow/grammar.json).

  Storage: localStorage only, under `repatterning:casts`. No server, no auth,
  no analytics, nothing leaves the browser. Same privacy stance as the NVC
  tool, one step along: "nothing is saved" becomes "saved only here".

  Two ways a cast arrives: caster-studio's "Save to my spiral" button (it
  writes the same key), or the by-hand recorder on this page.

  Deliberately NOT here: any interpretation engine, insight generator or
  score. The person does the interpreting; this view only externalises the
  sequence so it can be looked at. That restraint is the point.
-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);color-scheme:light;
    font-family:var(--sans,Inter,system-ui,sans-serif)}
  .wrap{display:flex;height:calc(100vh - 52px);min-height:0}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;
    border-bottom:1px solid var(--line)}
  .toolbar .title{font-weight:700;font-size:14px;margin-right:auto}
  .toolbar .title .sub{color:var(--mut);font-weight:400;font-size:12px}
  .toolbar button{background:var(--surface);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .toolbar button:hover{border-color:var(--gold);color:var(--gold)}
  #plot{flex:1;position:relative;overflow:hidden;min-height:280px}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg:active{cursor:grabbing}
  path.spine{fill:none;stroke:var(--line-soft);stroke-width:1.1px}
  path.leg{fill:none;stroke:var(--gold);stroke-width:1.6px;opacity:.55}
  path.recur{fill:none;stroke:var(--gold);stroke-width:1.5px;stroke-dasharray:5 4;opacity:.9}
  circle.dot{cursor:pointer;stroke:var(--bg);stroke-width:1px}
  circle.dot:hover{stroke:var(--ink);stroke-width:1.8px}
  circle.dot.released{fill:var(--faint)!important;opacity:.55}
  circle.dot.sel{stroke:var(--ink);stroke-width:2.2px}
  text.lbl{font-size:9.5px;fill:var(--ink-soft);pointer-events:none;paint-order:stroke;
    stroke:var(--bg);stroke-width:2.5px;stroke-linejoin:round}
  text.turnlbl{font-size:9px;fill:var(--mut);pointer-events:none;paint-order:stroke;
    stroke:var(--bg);stroke-width:2.5px;stroke-linejoin:round}
  text.heaplbl{font-size:9.5px;fill:var(--mut);pointer-events:none;text-anchor:middle}
  circle.compost{fill:var(--faint);opacity:.5}
  .caption{padding:8px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);
    line-height:1.5}
  .caption b{color:var(--ink-soft);font-weight:600}
  aside{width:340px;max-width:86vw;background:var(--surface);border-left:1px solid var(--line);
    padding:16px;overflow:auto}
  aside h2{margin:.1em 0 .2em;font-size:18px;font-family:var(--serif-display,serif);line-height:1.25}
  aside .meta{font-size:11.5px;color:var(--mut);margin-bottom:12px}
  aside h3{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);
    margin:16px 0 6px}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    background:var(--chip);color:var(--ink-soft);margin:0 4px 4px 0;text-decoration:none}
  a.chip:hover{background:var(--gold);color:#fff}
  .note{font-size:12.5px;line-height:1.6;color:var(--ink-soft);margin:8px 0 0}
  .note em{color:var(--mut)}
  .sec{margin:12px 0 0}
  .sec .st{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
  .sec .sb{font-size:12.5px;line-height:1.6;color:var(--ink-soft);white-space:pre-wrap}
  .quote{border-left:2px solid var(--gold);padding-left:12px;font-size:13px;line-height:1.65;
    color:var(--ink-soft);white-space:pre-wrap;margin:10px 0}
  .btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit;margin:4px 4px 0 0}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
  .btn.primary:hover{background:var(--grammar-accent-dark);border-color:var(--grammar-accent-dark);color:#fff}
  label.fl{display:block;font-size:11px;color:var(--mut);margin:10px 0 3px}
  select,textarea,input[type=text]{width:100%;font:inherit;font-size:12.5px;padding:7px 9px;
    border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
  textarea{min-height:76px;resize:vertical;font-size:12px;line-height:1.5}
  .rec{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--panel2)}
  .ok{color:var(--gold);font-size:11.5px;margin-left:6px}
  .warn{font-size:12px;line-height:1.55;color:var(--ink-soft);background:var(--chip);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:12px}
  .castrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;
    border-bottom:1px dotted var(--line)}
  .castrow a{color:var(--ink);text-decoration:none;cursor:pointer}
  .castrow a:hover{color:var(--gold)}
  .castrow .s{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* Stacked: #stage's height is auto here, so a flex item with flex-basis:0 would
     collapse to its min-height and ignore `height`. Give the plot a definite box. */
  @media(max-width:820px){ .wrap{flex-direction:column;height:auto}
    #plot{flex:0 0 auto;height:56vh} aside{width:100%;max-width:none;border-left:none;border-top:1px solid var(--line)} }
  @media(max-width:430px){ .toolbar{padding:8px 12px;gap:7px} .toolbar .title{width:100%;font-size:13px}
    aside{padding:14px 12px} }
</style>
</head>
<body>
<script src="../site-header.js?v=53"></script>
<site-header active="spiral"></site-header>

<div class="wrap">
  <div id="stage">
    <div class="toolbar">
      <div class="title">The Spiral <span class="sub">— your own casts, in the order you made them</span></div>
      <button id="btn-record">Record a cast</button>
      <button id="btn-io">Export / import</button>
      <button id="btn-about">What this is</button>
    </div>
    <div id="plot"><svg id="svg"></svg></div>
    <div class="caption" id="caption">Loading the deck…</div>
  </div>
  <aside id="panel"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── storage ───────────────────────────────────────────────────────────────────
// ONE key, shared with caster-studio's "Save to my spiral" button. An array of
// casts, oldest first. Anything unreadable is treated as empty rather than
// thrown at the visitor — a corrupt key must never make the page unusable.
const KEY = 'repatterning:casts';
function loadCasts(){
  try {
    const a = JSON.parse(localStorage.getItem(KEY) || '[]');
    return Array.isArray(a) ? a.filter(c => c && Array.isArray(c.positions)) : [];
  } catch(_){ return []; }
}
function saveCasts(a){
  try { localStorage.setItem(KEY, JSON.stringify(a)); return true; }
  catch(_){ return false; }   // private-browsing quota, or storage disabled
}

// The three house positions, in reading order. Position labels arrive from
// spreads.json's `spp` spread ("Structures · Process · Possibilities"); card
// categories in the overflow grammar are singular ("Structure"). Normalised
// here so the two vocabularies line up without either being rewritten.
const POS = ['Structures','Process','Possibilities'];
const POSKEY = s => String(s||'').toLowerCase().replace(/ies$/,'y').replace(/s$/,'');
const CATCOL = { structure:'#c9a24b', process:'#0f766e', possibility:'#6d8ec9' };

let CARDS = {};           // id -> overflow item
let CARDLIST = [];        // castable overflow items, in deck order
let PROXTERMS = null;     // Set of terms that exist in the proximity model
let casts = [];
let sel = null;           // {ci, pi}

// ── data ──────────────────────────────────────────────────────────────────────
fetch('../schools/overflow/grammar.json')
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(g => {
    (g.items||[]).forEach(it => {
      CARDS[it.id] = it;
      if (it.category && !['group','root','Guide'].includes(it.category)) CARDLIST.push(it);
    });
    CARDLIST.sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    init();
  })
  .catch(() => {
    $('caption').innerHTML = 'Could not load <code>schools/overflow/grammar.json</code> — ' +
      'the deck this view reads. Your saved casts are untouched; reload to try again.';
  });

// Loaded lazily and never blocking: it only decides whether a keyword gets a
// "see its neighbourhood" chip.
function proxTerms(){
  if (PROXTERMS) return Promise.resolve(PROXTERMS);
  return fetch('../schools/_proximity.json').then(r => r.json())
    .then(d => (PROXTERMS = new Set((d.terms||[]).map(t => t.term))))
    .catch(() => (PROXTERMS = new Set()));
}

function init(){
  casts = loadCasts();
  draw();
  $('btn-record').addEventListener('click', showRecorder);
  $('btn-io').addEventListener('click', showIO);
  $('btn-about').addEventListener('click', showAbout);
  if (!casts.length) showEmpty(); else showAbout();
  setCaption();
}

function setCaption(){
  const n = casts.length;
  const released = casts.reduce((s,c) => s + ((c.released||[]).length), 0);
  $('caption').innerHTML = n
    ? `<b>${n}</b> cast${n===1?'':'s'}, oldest at the centre${released?`, <b>${released}</b> card${released===1?'':'s'} released to the Heap`:''}. ` +
      `The dashed arc runs from each turn's Possibilities to the next turn's Structures — ` +
      `the deck's own rule, drawn rather than stated. ` +
      `<b>This record is held only in this browser</b>: no account, no server, nothing sent anywhere. ` +
      `Clearing your browser data clears it, so export the JSON if you want to keep it.`
    : `Nothing recorded yet. <b>This record is held only in this browser</b> — no account, no server, ` +
      `nothing sent anywhere, and clearing your browser data clears it.`;
}

// ── geometry ──────────────────────────────────────────────────────────────────
// An Archimedean spiral: r grows linearly with the angle, so every turn sits
// the same distance from the last and the eye reads distance-from-centre as
// elapsed time. t is measured in turns — cast i, position j of m sits at
// t = i + j/m.
let G, SVG, ZOOM, GEO = null;

function geom(W, H){
  const n = Math.max(casts.length, 1);
  const R0 = 34;                                    // the Heap's clearance at the centre
  const Rmax = Math.max(96, Math.min(W, H) / 2 - 34);
  const K = (Rmax - R0) / n;                        // radius gained per turn
  const TH0 = -Math.PI / 2;                         // every turn starts at 12 o'clock
  return {
    n, R0, K, cx: W/2, cy: H/2,
    at(t){
      const r = R0 + K * t, th = TH0 + 2*Math.PI*t;
      return [this.cx + r*Math.cos(th), this.cy + r*Math.sin(th)];
    },
    // A sampled polyline along the spiral between two t values — the curve is
    // drawn, not approximated by a straight chord, so an arc reads as a turn.
    seg(t0, t1, steps){
      const s = steps || Math.max(8, Math.round((t1-t0) * 48));
      let d = '';
      for (let k = 0; k <= s; k++){
        const p = this.at(t0 + (t1-t0) * k/s);
        d += (k ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2);
      }
      return d;
    }
  };
}

function draw(){
  const el = $('plot'), W = el.clientWidth || 640, H = el.clientHeight || 460;
  SVG = d3.select('#svg').attr('viewBox', [0,0,W,H]);
  SVG.selectAll('*').remove();
  G = SVG.append('g');
  ZOOM = d3.zoom().scaleExtent([0.5,10]).on('zoom', ev => {
    G.attr('transform', ev.transform);
    G.selectAll('text.lbl').style('display', ev.transform.k > 1.4 ? null : 'none');
  });
  SVG.call(ZOOM);

  const g = GEO = geom(W, H);

  // The Heap — the deck's own compost card, sitting at the centre of the
  // spiral where released cards come to rest. Drawn even when empty: it is
  // part of the practice, not a status indicator.
  const heap = G.append('g').attr('class','heap');
  const released = casts.flatMap((c,ci) => (c.released||[]).map(id => ({ci,id})));
  heap.selectAll('circle.compost').data(released.slice(0,40)).join('circle')
    .attr('class','compost')
    .attr('r', 3)
    .attr('cx', (d,i) => g.cx + Math.cos(i*2.399) * (4 + (i%5)*2.6))
    .attr('cy', (d,i) => g.cy + Math.sin(i*2.399) * (4 + (i%5)*2.6));
  heap.append('text').attr('class','heaplbl')
    .attr('x', g.cx).attr('y', g.cy - 17)
    .text(released.length ? 'The Heap · ' + released.length : 'The Heap');

  if (!casts.length){
    G.append('path').attr('class','spine').attr('d', g.seg(0, 2.6));
    return;
  }

  // The spine: the whole spiral, faint, so the shape stays legible even where
  // a cast recorded fewer than three cards.
  G.append('path').attr('class','spine').attr('d', g.seg(0, casts.length));

  casts.forEach((c, ci) => {
    const m = Math.max(c.positions.length, 1);

    // within a cast: solid legs, Structures → Process → Possibilities
    for (let j = 0; j < m - 1; j++)
      G.append('path').attr('class','leg').attr('d', g.seg(ci + j/m, ci + (j+1)/m));

    // between casts: the recursion, dashed. The Possibilities of this turn
    // become the Structures of the next — the one claim the deck makes about
    // itself, and the only reason this view exists.
    if (ci < casts.length - 1)
      G.append('path').attr('class','recur').attr('d', g.seg(ci + (m-1)/m, ci + 1));

    const p0 = g.at(ci);
    G.append('text').attr('class','turnlbl')
      .attr('x', p0[0] + 7).attr('y', p0[1] - 7)
      .text(shortDate(c.ts));

    c.positions.forEach((p, pi) => {
      const t = ci + pi/m, xy = g.at(t);
      const card = CARDS[p.card_id];
      const cat = POSKEY((card && card.category) || p.position);
      const isReleased = (c.released||[]).includes(p.card_id);
      // Released cards drop inward toward the Heap — greyed, never removed.
      const dx = isReleased ? g.cx + (xy[0]-g.cx)*0.62 : xy[0];
      const dy = isReleased ? g.cy + (xy[1]-g.cy)*0.62 : xy[1];
      const node = G.append('g').attr('class','n');
      node.append('circle')
        .attr('class', 'dot' + (isReleased ? ' released' : '') +
              (sel && sel.ci===ci && sel.pi===pi ? ' sel' : ''))
        .attr('cx', dx).attr('cy', dy).attr('r', 5.5)
        .attr('fill', CATCOL[cat] || '#8a8273')
        .on('click', () => select(ci, pi))
        .append('title').text((p.card_name||p.card_id) + ' — ' + (p.position||POS[pi]||''));
      node.append('text').attr('class','lbl')
        .attr('x', dx + 8).attr('y', dy + 3.5)
        .style('display','none')
        .text(p.card_name || p.card_id);
    });
  });
}
window.addEventListener('resize', () => { if (CARDLIST.length) draw(); });

function shortDate(ts){
  const d = new Date(ts);
  return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function fullDate(ts){
  const d = new Date(ts);
  return isNaN(d) ? String(ts||'') : d.toLocaleString();
}

// ── the panel ─────────────────────────────────────────────────────────────────
function select(ci, pi){
  sel = { ci, pi };
  draw();
  const c = casts[ci], p = c.positions[pi], card = CARDS[p.card_id];
  const released = (c.released||[]).includes(p.card_id);
  const cat = (card && card.category) || '';
  const landed = p.position || POS[pi] || '';
  // A plain statement of fact from The Spread's own "how to use": a card has a
  // native position, and it may have landed somewhere else. Stated, not read.
  const resonance = (cat && landed && POSKEY(cat) !== POSKEY(landed))
    ? `<p class="note">Native position: <b>${esc(cat)}</b>. It landed in <b>${esc(landed)}</b>.</p>`
    : (cat ? `<p class="note">Native position: <b>${esc(cat)}</b> — where it landed.</p>` : '');

  let secs;
  if (card && card.sections){
    const order = ['body', 'in ' + POSKEY(landed), 'in structure', 'in process', 'in possibility', 'how to use'];
    const rank = k => { const i = order.indexOf(String(k).toLowerCase()); return i < 0 ? 99 : i; };
    secs = Object.keys(card.sections).sort((a,b) => rank(a) - rank(b))
      .map(k => `<div class="sec"><div class="st">${esc(k)}</div>` +
                `<div class="sb">${esc(card.sections[k])}</div></div>`).join('');
  } else {
    secs = `<p class="note">This card is not from the Overflow deck, so its text is not held here.` +
      (p.source_deck ? ` Open <a href="cards.html?src=../schools/${encodeURIComponent(p.source_deck)}/grammar.json">${esc(p.source_deck)}</a> to read it.` : '') +
      `</p>`;
  }

  $('panel').innerHTML = `
    <div class="meta">${esc(landed)} · cast ${ci+1} of ${casts.length} · ${esc(fullDate(c.ts))}</div>
    <h2>${card && card.symbol ? esc(card.symbol) + ' · ' : ''}${esc(p.card_name || p.card_id)}</h2>
    ${released ? '<div class="meta">Released to the Heap — kept, not deleted.</div>' : ''}
    ${c.question ? `<p class="note"><em>Question held:</em> ${esc(c.question)}</p>` : ''}
    ${resonance}
    <div id="proxchips"></div>
    ${secs}
    ${c.note ? `<h3>Your note on this cast</h3><p class="note">${esc(c.note)}</p>` : ''}
    <h3>This cast</h3>
    ${c.positions.map((q,qi) => `<div class="castrow">
      <a onclick="select(${ci},${qi})">${esc(q.card_name||q.card_id)}</a>
      <span class="s">${esc(q.position||POS[qi]||'')}</span></div>`).join('')}
    <h3>Actions</h3>
    <button class="btn" onclick="toggleRelease(${ci},${esc(JSON.stringify(p.card_id))})">${released ? 'Take back from the Heap' : 'Release to the Heap'}</button>
    <button class="btn" onclick="editNote(${ci})">${c.note ? 'Edit note' : 'Add a note'}</button>
    <button class="btn" onclick="deleteCast(${ci})">Delete this cast</button>
    <p class="note"><em>Releasing greys the card and drops it inward toward the Heap at the centre.
    Nothing is deleted — the record stays load-bearing, which is what the Heap is for.</em></p>`;

  // "See its neighbourhood" — only for keywords the proximity model actually holds.
  if (card && card.keywords) proxTerms().then(set => {
    const hits = card.keywords.filter(k => set.has(k));
    const el = $('proxchips');
    if (!el || !hits.length) return;
    el.innerHTML = '<h3>See its neighbourhood</h3>' + hits.map(k =>
      `<a class="chip" href="proximity.html?q=${encodeURIComponent(k)}">${esc(k)} →</a>`).join('');
  });
}

// ── writes ────────────────────────────────────────────────────────────────────
function persist(){
  if (!saveCasts(casts))
    alert('This browser would not let the page save (private mode, or storage is full). Export your JSON before leaving.');
  draw(); setCaption();
}

function toggleRelease(ci, cardId){
  const c = casts[ci];
  c.released = c.released || [];
  const i = c.released.indexOf(cardId);
  if (i < 0) c.released.push(cardId); else c.released.splice(i,1);
  persist(); select(ci, sel ? sel.pi : 0);
}
function editNote(ci){
  const c = casts[ci];
  const v = prompt('A note on this cast — kept in this browser only:', c.note || '');
  if (v === null) return;
  c.note = v.trim() || undefined;
  persist(); select(ci, sel ? sel.pi : 0);
}
function deleteCast(ci){
  if (!confirm('Delete this cast from your spiral? Releasing keeps a card in the record; deleting removes the whole turn.')) return;
  casts.splice(ci,1); sel = null; persist();
  casts.length ? showAbout() : showEmpty();
}

// ── panels: empty state, about, recorder, import/export ───────────────────────
function showEmpty(){
  const spread = CARDS['the-spread'];
  const body = (spread && spread.sections && spread.sections.body) || '';
  $('panel').innerHTML = `
    <h2>Nothing here yet</h2>
    <div class="meta">The Spiral holds your own casts, in the order you made them.</div>
    <p class="note">This is the deck's own instruction, in its own words:</p>
    <div class="quote">${esc(body)}</div>
    <p class="note">Cast the house spread in the <a href="caster-studio.html">Spread Caster</a>
    and press <b>Save to my spiral</b>, or record one you have already dealt with real cards:</p>
    <button class="btn primary" onclick="showRecorder()">Record a cast by hand</button>
    <div class="warn">Everything on this page is stored in this browser and nowhere else.
    No account, no server, no analytics. Clearing your browser data clears it — the export
    button copies the whole record as JSON so you can keep it yourself.</div>`;
}

function showAbout(){
  sel = null; draw();
  $('panel').innerHTML = `
    <h2>Your own process, externalised</h2>
    <div class="meta">${casts.length} cast${casts.length===1?'':'s'} held in this browser</div>
    <p class="note">The <a href="proximity.html">Proximity</a> view shows a corpus's priors —
    static geometry, identical for every visitor. This one shows something no corpus holds:
    the order <em>you</em> dealt these cards in.</p>
    <p class="note">Oldest cast at the centre, one turn outward per cast. Within a turn the solid
    legs run Structures → Process → Possibilities. Between turns the arc is dashed, and it runs
    from the Possibilities you drew to the Structures you drew next — the deck's rule that every
    opening becomes the next constraint, drawn instead of asserted.</p>
    <p class="note">Dot colour is the card's <em>native</em> position in the deck, not the position
    it landed in — so a gold dot in the third slot is a Structure card that came up as a
    Possibility. The Spread says such a card asks whether the constraint itself is the opening.
    That reading is yours to make; this page will not make it for you.</p>
    <h3>Recent</h3>
    ${casts.length ? casts.slice().reverse().slice(0,12).map((c,k) => {
        const ci = casts.length - 1 - k;
        return `<div class="castrow"><a onclick="select(${ci},0)">${esc(
          c.positions.map(p => p.card_name || p.card_id).join(' · '))}</a>
          <span class="s">${esc(shortDate(c.ts))}</span></div>`;
      }).join('') : '<p class="note">None yet.</p>'}
    <div class="warn">Held in this browser only — no account, no server, nothing sent anywhere.
    Clearing your browser data clears it.</div>`;
}

function showRecorder(){
  const opts = CARDLIST.map(c =>
    `<option value="${esc(c.id)}">${esc(c.symbol||'')} ${esc(c.name)} — ${esc(c.category)}</option>`).join('');
  $('panel').innerHTML = `
    <h2>Record a cast</h2>
    <div class="meta">For a spread you dealt with real cards, or anywhere else</div>
    <div class="rec">
      ${POS.map((p,i) => `<label class="fl">${esc(p)}</label>
        <select id="rec${i}"><option value="">— choose a card —</option>${opts}</select>`).join('')}
      <label class="fl">The question you held (optional)</label>
      <input type="text" id="recq" placeholder="Am I overflowing or extracting?">
      <label class="fl">A note (optional)</label>
      <textarea id="recn" placeholder="What you saw in it."></textarea>
      <label class="fl">When (optional — defaults to now)</label>
      <input type="text" id="rect" placeholder="2026-08-21">
      <div style="margin-top:10px">
        <button class="btn primary" onclick="saveRecorded()">Add to the spiral</button>
        <button class="btn" onclick="casts.length?showAbout():showEmpty()">Cancel</button>
      </div>
    </div>
    <p class="note">Cards come from <a href="cards.html?src=../schools/overflow/grammar.json">the
    Overflow deck</a>. A cast with only one or two cards filled in is fine — the spiral draws what
    is there.</p>`;
}

function saveRecorded(){
  const positions = [];
  POS.forEach((p,i) => {
    const id = $('rec'+i).value;
    if (!id) return;
    positions.push({ position:p, card_id:id, card_name:(CARDS[id]||{}).name || id, source_deck:'overflow' });
  });
  if (!positions.length){ alert('Choose at least one card.'); return; }
  const when = ($('rect').value||'').trim();
  const d = when ? new Date(when) : new Date();
  casts.push({
    ts: (isNaN(d) ? new Date() : d).toISOString(),
    spread: 'Structures · Process · Possibilities', spread_id: 'spp',
    deck: 'Overflow — Structures, Process, Possibilities',
    question: ($('recq').value||'').trim() || undefined,
    note: ($('recn').value||'').trim() || undefined,
    positions, released: []
  });
  casts.sort((a,b) => String(a.ts).localeCompare(String(b.ts)));
  persist(); showAbout();
}

function showIO(){
  $('panel').innerHTML = `
    <h2>Export / import</h2>
    <div class="meta">The whole record, as plain JSON</div>
    <p class="note">There is no account behind this page, so there is no sync. Export copies your
    casts to the clipboard; import pastes them back — into this browser, another browser, or a
    file you keep yourself.</p>
    <button class="btn primary" onclick="copyAll()">Copy my spiral as JSON</button><span id="cpok" class="ok"></span>
    <label class="fl">Paste a spiral to import</label>
    <textarea id="iotext" placeholder="[ … ]"></textarea>
    <button class="btn" onclick="importAll(false)">Add to what is here</button>
    <button class="btn" onclick="importAll(true)">Replace everything</button>
    <div class="warn">Import reads only the fields this page writes; anything else in the JSON is
    ignored. Replacing cannot be undone — copy first if you are unsure.</div>`;
}

function copyAll(){
  const txt = JSON.stringify(casts, null, 2);
  const done = () => { const o = $('cpok'); if (o){ o.textContent = 'copied ✓'; setTimeout(() => o.textContent = '', 1600); } };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(_){ alert('Copy failed — select the JSON manually.'); }
  document.body.removeChild(ta);
}

function importAll(replace){
  let a;
  try { a = JSON.parse($('iotext').value); } catch(e){ alert('That is not valid JSON.'); return; }
  if (!Array.isArray(a)){ alert('Expected a JSON array of casts.'); return; }
  const clean = a.filter(c => c && Array.isArray(c.positions)).map(c => ({
    ts: c.ts || new Date().toISOString(),
    spread: c.spread, spread_id: c.spread_id, deck: c.deck,
    question: c.question || undefined, note: c.note || undefined,
    positions: c.positions.map(p => ({
      position: p.position, card_id: p.card_id,
      card_name: p.card_name || (CARDS[p.card_id]||{}).name || p.card_id,
      source_deck: p.source_deck || 'overflow'
    })),
    released: Array.isArray(c.released) ? c.released : []
  }));
  if (!clean.length){ alert('No readable casts in that JSON.'); return; }
  if (replace && !confirm('Replace your ' + casts.length + ' existing cast(s) with these ' + clean.length + '?')) return;
  casts = replace ? clean : casts.concat(clean);
  casts.sort((x,y) => String(x.ts).localeCompare(String(y.ts)));
  sel = null; persist(); showAbout();
}
</script>
