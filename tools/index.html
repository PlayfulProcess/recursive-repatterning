<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../theme.css?v=6">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practices · Recursive Repatterning</title>
<meta name="description" content="A gallery of the practices — tools that put a school's ideas into your hands, rendered live from tools/_tools.json. Hosted-on-this-site tools and tools that live on outside platforms are marked honestly.">
<link rel="icon" type="image/svg+xml" href="../public/favicon.svg?v=2">
<link rel="stylesheet" href="../style.css?v=5">
<style>
  main.wrap{max-width:1120px}

  /* ── hero, matching courses.html's editorial register ── */
  .phero{text-align:center;max-width:640px;margin:26px auto 0;padding:0 18px}
  .phero .eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:#0f766e;margin:0 0 10px}
  .phero h1{font-family:var(--serif-display);font-weight:600;font-size:clamp(32px,6vw,50px);
    line-height:1.05;letter-spacing:.3px;margin:0;color:var(--ink)}
  .phero h1 .gold{color:var(--gold)}
  .phero .tagline{display:block;font-family:var(--serif-body);font-style:italic;color:var(--ink-soft);
    font-size:clamp(15.5px,2vw,18px);line-height:1.55;margin:14px auto 0;max-width:56ch}

  main.wrap > #root{max-width:1120px;margin:0 auto;padding:0 18px 64px}
  .loading{text-align:center;color:var(--mut);padding:60px 0;font-style:italic;font-family:var(--serif-body)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:40px}

  .pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-soft);
    border-radius:12px;padding:18px 18px 16px;color:var(--ink);gap:8px;
    transition:transform .15s,box-shadow .15s,border-color .15s}
  .pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--gold)}

  /* The card's main action (title → blurb → badges → "Open") lives inside one
     link; the school chips below are separate links — see the JS comment for
     why they can't both be inside a single outer <a>. */
  .pcard-link{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;flex:1}

  .pcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .pcard h3{margin:0;font-size:1.05rem;line-height:1.3;font-family:var(--serif-display);font-weight:600}
  .pcard .ext-marker{flex-shrink:0;font-family:var(--sans);font-size:11px;color:var(--mut)}

  .pcard .blurb{font-family:var(--serif-body);font-size:.87rem;color:var(--ink-soft);line-height:1.55;flex:1;margin:0}

  .pcard .host{font-family:var(--sans);font-size:11px;color:var(--mut);font-style:italic;margin:0}

  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .badge{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    border-radius:999px;padding:2px 9px;border:1px solid var(--line-soft);color:var(--mut);background:var(--panel2)}
  .badge.ai{color:#8a5fb0;background:rgba(122,95,176,.1);border-color:rgba(122,95,176,.35)}
  .badge.auth{color:#0f766e;background:rgba(15,118,110,.08);border-color:rgba(15,118,110,.35)}

  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .chip{display:inline-block;font-family:var(--sans);font-size:11px;color:var(--gold);
    border:1px solid var(--line-soft);border-radius:999px;padding:3px 10px;text-decoration:none;
    background:var(--panel2)}
  .chip:hover{border-color:var(--gold);background:var(--surface)}

  .pcard .go{margin-top:8px;font-family:var(--sans);font-size:.82rem;font-weight:600;color:var(--gold)}

  /* Hosted tools read as first-class — a filled accent line and a plain "open" verb.
     External tools stay visually honest about being rented: a lighter border, the
     host named, and an explicit external-link marker on the title. */
  .pcard.hosted{border-color:var(--line-soft)}
  .pcard.hosted .top h3::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--good);margin-left:8px;vertical-align:middle}
  .pcard.external{background:var(--panel2)}
</style>
</head>
<body>
<script src="../site-header.js?v=52"></script>
<site-header active="practices"></site-header>

<main class="wrap">
  <section class="phero">
    <p class="eyebrow">Recursive Repatterning</p>
    <h1>The <span class="gold">Practices</span></h1>
    <p class="tagline">This is where the schools stop being reading and start being done. Each tool below
      declares which school it practises — pick a chip to open that school's own cards.</p>
  </section>
  <div id="root"><p class="loading">Loading the practices…</p></div>
</main>

<script>
(async function () {
  const root = document.getElementById('root');
  let manifest;
  try {
    manifest = await fetch('_tools.json').then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  } catch (e) {
    root.innerHTML = '<p class="loading">Could not load the practices manifest right now — try reloading.</p>';
    return;
  }

  const tools = (manifest && manifest.tools) || [];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  if (!tools.length) {
    root.innerHTML = '<p class="loading">No practices listed yet.</p>';
    return;
  }

  // "on <host>" label for an external tool, read off its URL — never invented copy.
  function hostLabel(url) {
    try {
      const h = new URL(url).hostname.replace(/^www\./, '');
      return 'on ' + h;
    } catch (e) {
      return '';
    }
  }

  const cardsHtml = tools.map(t => {
    const isExternal = !!t.external_url;
    const href = isExternal ? t.external_url : (esc(t.id) + '.html');
    const badges = [
      t.needs_ai ? '<span class="badge ai">Needs AI</span>' : '',
      t.needs_auth ? '<span class="badge auth">Needs sign-in</span>' : '',
    ].join('');
    const chips = (t.schools || []).map(slug =>
      `<a class="chip" href="../viewers/cards.html?src=../schools/${esc(slug)}/grammar.json">${esc(slug)}</a>`
    ).join('');
    const hostNote = isExternal ? `<p class="host">${esc(hostLabel(t.external_url))}</p>` : '';
    const extMarker = isExternal ? '<span class="ext-marker">↗ external</span>' : '';
    const go = isExternal ? 'Open ↗' : 'Open →';

    // NOTE: the card's main action and the school chips must be two separate
    // links, not one nested inside the other — an <a> can't legally contain
    // another <a>, and browsers silently auto-close the outer one when they
    // hit the inner one, which breaks the whole card's layout.
    return `<div class="pcard ${isExternal ? 'external' : 'hosted'}">
      <a class="pcard-link" href="${esc(href)}"${isExternal ? ' target="_blank" rel="noopener"' : ''}>
        <div class="top"><h3>${esc(t.title)}</h3>${extMarker}</div>
        <p class="blurb">${esc(t.blurb)}</p>
        ${hostNote}
        ${badges ? `<div class="badges">${badges}</div>` : ''}
        <span class="go">${go}</span>
      </a>
      ${chips ? `<div class="chip-row">${chips}</div>` : ''}
    </div>`;
  }).join('');

  const hostedCount = tools.filter(t => !t.external_url).length;
  const externalCount = tools.length - hostedCount;

  root.innerHTML = `<p class="loading" style="padding:0 0 4px;font-style:normal">
      ${tools.length} practice${tools.length === 1 ? '' : 's'} —
      ${hostedCount} hosted here, ${externalCount} on outside platforms.</p>
    <div class="cards">${cardsHtml}</div>`;
})();
</script>

<script src="../site-footer.js?v=3"></script>
<site-footer base="../"></site-footer>
<script src="../assistant.js" defer></script>
</body>
</html>
